<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valentine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="hero">
      <div class="hero__overlay"></div>
      <section class="card">
        <p class="card__eyebrow">A tiny question for you</p>
        <h1>Would you be my Valentine?</h1>
        <p class="card__note">
          Upload your favorite photo to make this background yours.
        </p>
        <label class="upload">
          <span>Choose background photo</span>
          <input id="backgroundUpload" type="file" accept="image/*" />
        </label>
        <button class="yes">Yes, of course! 💖</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
